name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      # The Kaggle notebooks cannot be run here, so they are checked statically:
      # valid JSON, every code cell parses, no committed output.
      - name: Validate notebooks
        run: uv run python scripts/check_notebooks.py

      # Tests marked `db` need a live Oracle and PostgreSQL, so they are
      # excluded here and run locally with `make test-db`.
      - name: Unit tests
        run: uv run pytest -m "not db"
