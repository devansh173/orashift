[project]
name = "orashift"
version = "0.1.0"
description = "Execution-verified Oracle SQL to PostgreSQL translation with a fine-tuned open LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Devansh Bhargava", email = "bdevansh173@gmail.com" }]
keywords = ["oracle", "postgresql", "sql", "translation", "qlora", "fine-tuning"]

dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "oracledb>=2.5.1",
    "psycopg[binary]>=3.2.3",
    "sqlglot>=26.0.0",
]

[project.scripts]
orashift = "orashift.cli:app"

[project.optional-dependencies]
demo = [
    "gradio>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "kaggle>=1.6.17",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orashift"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "TID"]
ignore = [
    "ANN401",  # allow typing.Any where it is genuinely the right type
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Notebooks are linted for real errors, but not for conventions that do not
# apply to them: type annotations on throwaway helpers, and import order.
# Unsloth must be imported before transformers, so E402/I001 would fight the
# library's own requirement.
"notebooks/**" = ["ANN", "E402", "I001", "E401"]

[tool.ruff.lint.isort]
known-first-party = ["orashift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The demo lives in app/ rather than src/, because a HuggingFace Space expects
# app.py near the root. This puts it on the path for the tests.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "db: requires a live Oracle and/or PostgreSQL connection (skipped in CI)",
]
